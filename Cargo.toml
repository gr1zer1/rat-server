[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.29"
egui = "0.29"
anyhow = "1.0.104"
sysinfo = "0.39.6"
tokio-tungstenite = "0.26"

[profile.release]
opt-level = 3
lto = true
